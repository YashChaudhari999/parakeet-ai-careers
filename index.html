    <!--
      THEME SCRIPT — identical logic to parakeet-ai.com
      The real site:
        - Only enables dark/light toggle for /dashboard, /callSession, /auth/desktop, /resumeMaker
        - For ALL other pages (including /hiring) it REMOVES the "dark" class → forced light mode
      We replicate this exactly.
    -->
    <script>
      (function () {
        try {
          var prefixes = ["/dashboard", "/callSession", "/auth/desktop", "/resumeMaker"];
          var unthemed  = ["/resumeMaker/print"];
          var path = window.location.pathname;
          function match(p) { return path === p || path.indexOf(p + "/") === 0; }
          var themed = !unthemed.some(match) && prefixes.some(match);
          if (!themed) {
            // /hiring is NOT in the themed list → always light mode
            document.documentElement.classList.remove("dark");
            return;
          }
          // dashboard etc — read pk_theme_shell cookie
          var cookie = "pk_theme_shell";
          var fallback = "light";
          function read(name) {
            var m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
            return m ? m[1] : "";
          }
          function decode(value) {
            var r = value.indexOf("system:") === 0 ? value.slice(7) : value;
            return r === "light" || r === "dark" ? r : "";
          }
          var resolved = decode(read(cookie));
          if (!resolved) resolved = fallback;
          var isDark =
            resolved === "dark" ||
            (resolved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {}
      })();
    </script>

    <!-- Prevent FOUC: always white bg since hiring is forced light -->
    <style>html { background: #ffffff; }</style>
